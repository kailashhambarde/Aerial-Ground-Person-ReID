name: Add a paper
description: Propose a new AG-ReID paper or correct an existing record
title: "[Paper] "
labels: [paper]
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: Method name
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue and year
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Official paper URL
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Official code URL
  - type: textarea
    id: category
    attributes:
      label: Suggested taxonomy tags
      description: e.g. geometry, semantic alignment, video, multispectral
